version: '3.7'

services:

  db:
    image: mysql:8.0
    restart: always
    ports:
      - 2003:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: redmine
    volumes:
      - ./mysql-data:/var/lib/mysql

  redmine:
    image: redmine
    restart: always
    ports:
      - 1003:3000
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_PASSWORD: example
      REDMINE_SECRET_KEY_BASE: linh_supersecretkey1234
      # admin/admin
