version: '3.7'

services:

  db-redmine:
    image: mysql:8.0
    restart: always
    ports:
      - 2003:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: redmine
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - local_network

  redmine:
    image: redmine
    restart: always
    ports:
      - 1003:3000
    environment:
      REDMINE_DB_MYSQL: db-redmine:3306
      REDMINE_DB_PASSWORD: example
      REDMINE_SECRET_KEY_BASE: linh_supersecretkey1234
    depends_on:
      - db-redmine
    networks:
      - local_network

  simple-app:
    image: simple-app
    build:
      context: ../simple-app
      dockerfile: Dockerfile
    ports:
      - 1001:5173
    networks:
      - local_network

  db-wordpress:
    image: mysql
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - 2002:3306
    environment:
      MYSQL_ROOT_PASSWORD: your_mysql_root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: supersecretpassword123123
    networks:
      - local_network

  wordpress:
    depends_on:
      - db-wordpress
    image: wordpress
    ports:
      - 1002:80
    restart: always
    environment:
      WORDPRESS_DB_HOST: db-wordpress:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: supersecretpassword123123
    volumes:
      - ./html:/var/www/html
    networks:
      - local_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - redmine
      - wordpress
      - simple-app
    networks:
      - local_network

volumes:
  db_data:

networks:
  local_network:
    driver: bridge
